<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Annie</title>
		<link rel="stylesheet" href="connect.css" />
		<script type="module" src="connect.js"></script>
	</head>
	<body>
		<main>
			<img src="icon.svg" alt="" width="48" height="48" />
			<h1>Collega Annie</h1>
			<p>Scrivi l'indirizzo del tuo Annie, oppure incolla il tuo link personale per entrare subito.</p>
			<form>
				<label for="server">Indirizzo o link personale</label>
				<input id="server" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="annie.tuaazienda.it" required />
				<p id="error" role="alert" hidden></p>
				<button type="submit">Collega</button>
			</form>
			<p class="muted">Su Annie Cloud l'indirizzo è nella mail di benvenuto. Lo cambi quando vuoi dall'icona di Annie nella barra.</p>
		</main>
	</body>
</html>
