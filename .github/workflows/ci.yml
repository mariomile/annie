name: CI
on:
  push:
    branches: [main]
    # Text only: nothing for the checks to run on (Actions minutes are counted).
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4   # version read from packageManager (pnpm@10.17.1)
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Web console syntax
        run: node --check src/web/ui/app.js
      # The browser tests (web_screenshot, web_browse) run on a real Chromium.
      - name: Chromium for the browser tests
        run: pnpm exec playwright-core install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
      - run: pnpm test
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw-browsers
      - name: Deterministic segreteria evals (incl. PII checks)
        run: pnpm eval:segreteria
