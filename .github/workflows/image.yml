name: Image
# Builds the Dockerfile on every PR and checks that the container answers; on main it also
# publishes ghcr.io/<owner>/annie (the image Annie Cloud cells run, docs/runbook.md 6c and 6d)
# and ghcr.io/<owner>/annie-computer:fly (the computers' micro-VMs, runbook 6j).
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: image-${{ github.ref }}
  # A publish on main is never cut between its two tags.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t annie:ci .
      - name: The container starts and answers
        run: |
          docker run -d --name annie -e ANNIE_MODEL_PROVIDER=faux -p 127.0.0.1:8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true annie:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs annie
          exit 1

  # The instances' computers (ADR 0013): the image builds, and the provider works on a real daemon.
  computer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the computer image
        run: docker build -f docker/computer.Dockerfile -t annie-computer:ci docker
      - name: The computer on a real Docker host
        env:
          ANNIE_TEST_COMPUTER_IMAGE: annie-computer:ci
        run: pnpm vitest run test/computer-docker.live.test.ts
      # The micro-VM target (ADR 0015): its first process seals it off the network, then the same checks.
      - name: Build the micro-VM computer image
        run: docker build -f docker/computer.Dockerfile --target fly -t annie-computer:fly-ci docker
      - name: The micro-VM computer, sealed, on Docker's network
        env:
          ANNIE_TEST_FLY_IMAGE: annie-computer:fly-ci
        run: pnpm vitest run test/computer-fly.live.test.ts

  # Only this job can write packages, and only on main: a PR's Dockerfile never builds with it.
  publish:
    needs: [image, computer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      # Built again here rather than handed over as an artifact: no artifact storage needed, and
      # this job only ever runs on code already merged to main.
      - uses: actions/checkout@v5
      # The published image has Chromium, so cells can take screenshots (web_screenshot, ADR 0009).
      - name: Build
        run: docker build --build-arg WITH_BROWSER=1 -t annie:ci .
      - name: The published image starts and answers
        run: |
          docker run -d --name annie -e ANNIE_MODEL_PROVIDER=faux -p 127.0.0.1:8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true annie:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/healthz && exit 0; sleep 1; done
          docker logs annie
          exit 1
      - name: Push to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/annie"
          docker tag annie:ci "$image:${GITHUB_SHA::12}"
          docker tag annie:ci "$image:latest"
          docker push "$image:${GITHUB_SHA::12}"
          docker push "$image:latest"
      # The micro-VM computer (ADR 0015), checked by the computer job on this same commit.
      - name: Build and push the micro-VM computer image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          docker build -f docker/computer.Dockerfile --target fly -t annie-computer:fly-ci docker
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/annie-computer"
          docker tag annie-computer:fly-ci "$image:fly-${GITHUB_SHA::12}"
          docker tag annie-computer:fly-ci "$image:fly"
          docker push "$image:fly-${GITHUB_SHA::12}"
          docker push "$image:fly"
