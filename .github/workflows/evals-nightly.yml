name: Evals nightly
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC
  workflow_dispatch:
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deterministic evals
        run: pnpm eval:segreteria && pnpm eval:agente
      - name: Real models + LLM judge (skipped without ANNIE_JUDGE_MODEL_KEY, an Anthropic key)
        run: pnpm eval:segreteria:judge
        env:
          ANNIE_JUDGE_MODEL_KEY: ${{ secrets.ANNIE_JUDGE_MODEL_KEY }}
      - name: General agent with the real model (skipped without ANNIE_JUDGE_MODEL_KEY)
        # Runs also when the segreteria judge failed: the two measure different things.
        if: success() || failure()
        run: pnpm eval:agente:real
        env:
          ANNIE_JUDGE_MODEL_KEY: ${{ secrets.ANNIE_JUDGE_MODEL_KEY }}
      - name: Upload judge report
        if: always()
        # A full artifact quota must not turn the evals red: the report is a convenience.
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: segreteria-judge-report
          path: evals/segreteria/last-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload agent report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: agente-report
          path: evals/agente/last-report/
          if-no-files-found: ignore
          retention-days: 14
